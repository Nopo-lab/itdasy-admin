<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>사용자 · 잇데이 운영자</title>
  <link rel="stylesheet" href="style.css?v=20260429-admin-plan1" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar"></aside>
    <main class="main">
      <h1 class="page-title">사용자</h1>
      <p class="page-sub">가입자 검색, 요금제, 계정 상태를 확인합니다. 개인정보는 기본으로 가려서 표시합니다.</p>

      <div class="card">
        <div class="user-tools">
          <div class="form-row user-search">
            <label for="user-search">이름 또는 이메일</label>
            <input type="search" id="user-search" placeholder="예: wonyoung 또는 example@email.com" autocomplete="off" />
          </div>
          <div class="form-row user-limit">
            <label for="user-limit">표시 수</label>
            <select id="user-limit">
              <option value="25">25명</option>
              <option value="50" selected>50명</option>
              <option value="100">100명</option>
              <option value="200">200명</option>
            </select>
          </div>
          <button class="btn ghost" id="toggle-email" type="button">이메일 보기</button>
          <button class="btn" id="user-refresh" type="button">조회</button>
        </div>
        <div class="table-wrap">
          <table class="tbl" id="users-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>이름</th>
                <th>이메일</th>
                <th>요금제</th>
                <th>상태</th>
                <th>가입일</th>
                <th>작업</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="7" class="muted-cell">사용자를 불러오는 중입니다.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="app-admin-core.js?v=20260429-admin-plan1"></script>
  <script src="app-admin-users.js?v=20260429-admin-plan1"></script>
  <script>
    AdminCore.renderSidebar("users");
  </script>
</body>
</html>
