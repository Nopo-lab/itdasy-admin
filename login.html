<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>잇데이 운영자 로그인</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-shell">
    <form class="login-card" id="login-form" autocomplete="off">
      <h1>잇데이 운영자</h1>
      <p class="lead">운영자 권한 계정만 접근 가능합니다.</p>
      <div class="login-error" id="err"></div>
      <div class="form-row">
        <label for="email">이메일</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="form-row">
        <label for="password">비밀번호</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn" id="login-btn" style="width:100%">로그인</button>

      <div style="margin:20px 0 12px;border-top:1px solid var(--border);padding-top:16px;">
        <p style="color:var(--text-2);font-size:11.5px;text-align:center;margin-bottom:10px;">
          또는 잇데이 메인 앱 토큰 붙여넣기 (카카오/구글 OAuth 사용자)
        </p>
        <textarea id="token-paste" rows="3" placeholder="잇데이 콘솔에서 localStorage.getItem('itdasy_token::staging') 결과 그대로" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--bg-2);color:var(--text);font-family:monospace;font-size:11px;"></textarea>
        <button type="button" id="token-btn" class="btn" style="width:100%;margin-top:8px;background:var(--bg-3);color:var(--text);">토큰으로 들어가기</button>
      </div>

      <p style="color:var(--text-2);font-size:11.5px;margin-top:18px;text-align:center;">
        백엔드: <span id="api-base"></span>
      </p>
    </form>
  </div>

  <script src="app-admin-core.js"></script>
  <script>
    document.getElementById("api-base").textContent = AdminCore.API_BASE;
    document.getElementById("login-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var err = document.getElementById("err");
      err.style.display = "none";
      var email = document.getElementById("email").value.trim();
      var password = document.getElementById("password").value;
      var btn = document.getElementById("login-btn");
      btn.disabled = true;
      btn.textContent = "로그인 중…";
      try {
        var res = await fetch(AdminCore.API_BASE + "/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ email: email, password: password }),
        });
        var data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || "로그인 실패");
        }
        AdminCore.setToken(data.access_token);
        AdminCore.setAdminUser({ user_id: data.user_id, name: data.name, email: data.email });
        location.href = "index.html";
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "로그인";
      }
    });

    // 토큰 직접 붙여넣기 — 카카오/구글 OAuth 사용자 (비밀번호 없음)
    document.getElementById("token-btn").addEventListener("click", async function () {
      var err = document.getElementById("err");
      err.style.display = "none";
      var raw = document.getElementById("token-paste").value.trim();
      // 따옴표 제거 (localStorage.getItem 결과 복사 시 따옴표 포함 케이스)
      var token = raw.replace(/^["']|["']$/g, "").trim();
      if (!token || token.length < 30) {
        err.textContent = "토큰 형식이 올바르지 않아요"; err.style.display = "block"; return;
      }
      // 백엔드 admin endpoint 한 번 호출해서 admin 권한 검증
      try {
        var res = await fetch(AdminCore.API_BASE + "/admin/users?limit=1", {
          headers: { Authorization: "Bearer " + token, Accept: "application/json" },
        });
        if (res.status === 403) { err.textContent = "이 토큰은 admin 권한 없음"; err.style.display = "block"; return; }
        if (res.status === 401) { err.textContent = "토큰 만료 — 잇데이 메인 앱에서 다시 로그인"; err.style.display = "block"; return; }
        if (!res.ok) { err.textContent = "토큰 검증 실패: " + res.status; err.style.display = "block"; return; }
        // JWT payload 에서 user_id 추출
        var payload = JSON.parse(atob(token.split(".")[1]));
        AdminCore.setToken(token);
        AdminCore.setAdminUser({ user_id: parseInt(payload.sub), name: "관리자", email: "(token)" });
        location.href = "index.html";
      } catch (ex) {
        err.textContent = "토큰 검증 오류: " + ex.message; err.style.display = "block";
      }
    });
  </script>
</body>
</html>
